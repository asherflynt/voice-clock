# Voice Clock – CrowPanel 2.1" rotary display
# Analog clock face + device control page (knob and touch).
# Hardware init follows Elecrow's ESPHome Lesson 05 for the CrowPanel 2.1" (see firmware/README.md).

esphome:
  name: voice-clock
  friendly_name: Voice Clock
  includes:
    - voice_clock.h
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    - priority: 800
      then:
        # Panel power on, then pulse reset. The panel stays dark without this.
        - output.turn_on: touch_int_release
        - output.turn_on: lcd_power
        - output.turn_on: display_reset
        - delay: 100ms
        - output.turn_off: display_reset
        - delay: 600ms
        - light.turn_on:
            id: display_backlight
            brightness: 0.6

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

packages:
  lamp_1: !include
    file: ha_light.yaml
    vars:
      idx: 0
      entity: light.lamp_1            # <- your HA light
  lamp_2: !include
    file: ha_light.yaml
    vars:
      idx: 1
      entity: light.lamp_2            # <- your HA light
  reading_light: !include
    file: ha_light.yaml
    vars:
      idx: 2
      entity: light.reading_light     # <- your HA light

globals:
  - id: dev_idx          # selected device, index into vc::NAMES
    type: int
    initial_value: '0'
  - id: ui_mode          # 0 = browse devices, 1 = adjust selected device
    type: int
    initial_value: '0'
  - id: on_clock
    type: bool
    initial_value: 'true'
  - id: levels           # 0-100 per device
    type: std::array<int, 5>
    initial_value: '{0, 0, 0, 0, 60}'
  - id: states_on        # lights: on; voice: not muted
    type: std::array<bool, 5>
    initial_value: '{false, false, false, true, true}'
  - id: sun_down
    type: bool
    initial_value: 'false'
  - id: night
    type: bool
    initial_value: 'false'
  - id: day_brightness   # screen level to restore when night mode ends
    type: int
    initial_value: '60'
  - id: alarm_enabled
    type: bool
    initial_value: 'false'
  - id: alarm_time_str   # "HH:MM:SS" from the reSpeaker
    type: std::string
  - id: timer_active
    type: bool
    initial_value: 'false'
  - id: timer_end_ms     # millis() when the first active timer reaches 0
    type: uint32_t
    initial_value: '0'
  - id: timer_total_s    # largest seconds-left seen for this timer, for the ring
    type: int
    initial_value: '0'
  - id: last_local_ms
    type: std::array<uint32_t, 5>
    initial_value: '{0, 0, 0, 0, 0}'

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Voice-Clock-Fallback"
    password: !secret fallback_ap_password

captive_portal:

i2c:
  sda: GPIO38
  scl: GPIO39
  id: bus_a
  scan: true

# PCF8574 pins:
# P0 touch reset, P2 touch interrupt, P3 LCD power, P4 LCD reset, P5 knob button
pcf8574:
  - id: pcf
    address: 0x21

output:
  - platform: ledc
    pin: 6
    id: bl_pwm
    frequency: 19531Hz

  - platform: gpio
    id: touch_int_release
    pin:
      pcf8574: pcf
      number: 2
      mode:
        output: true
      inverted: false

  - platform: gpio
    id: lcd_power
    pin:
      pcf8574: pcf
      number: 3
      mode:
        output: true
      inverted: false

  - platform: gpio
    id: display_reset
    pin:
      pcf8574: pcf
      number: 4
      mode:
        output: true
      inverted: true

light:
  - platform: monochromatic
    name: "LCD Backlight"
    output: bl_pwm
    id: display_backlight
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    on_state:
      - lambda: |-
          id(levels)[vc::SCREEN_IDX] = (int) lroundf(id(display_backlight).remote_values.get_brightness() * 100);
      - script.execute: refresh_ui

sensor:
  - platform: rotary_encoder
    id: knob
    internal: true
    # Pins swapped from Elecrow's sample so clockwise counts up.
    pin_a:
      number: 4
      mode:
        input: true
        pullup: true
    pin_b:
      number: 42
      mode:
        input: true
        pullup: true
    resolution: 1
    filters:
      - debounce: 20ms
    on_clockwise:
      - script.execute:
          id: knob_step
          dir: 1
    on_anticlockwise:
      - script.execute:
          id: knob_step
          dir: -1

  # reSpeaker next timer: seconds left, -1 when none. Updated every 5 s; counted down locally.
  - platform: homeassistant
    id: ha_next_timer
    entity_id: sensor.${voice_sat}_next_timer
    internal: true
    on_value:
      - lambda: |-
          if (std::isnan(x) || x <= 0) {
            id(timer_active) = false;
            id(timer_total_s) = 0;
          } else {
            int s = (int) x;
            if (!id(timer_active) || s > id(timer_total_s)) id(timer_total_s) = s;
            id(timer_active) = true;
            id(timer_end_ms) = millis() + (uint32_t) s * 1000;
          }
      - script.execute: update_overlays

  # Music player volume (0-1) and mute.
  - platform: homeassistant
    id: ha_volume
    entity_id: ${music_player}
    attribute: volume_level
    internal: true
    on_value:
      - lambda: |-
          if (std::isnan(x) || millis() - id(last_local_ms)[vc::MUSIC_IDX] < vc::ECHO_IGNORE_MS) return;
          id(levels)[vc::MUSIC_IDX] = (int) lroundf(x * 100);
      - script.execute: refresh_ui

text_sensor:
  - platform: homeassistant
    id: ha_sun
    entity_id: sun.sun
    internal: true
    on_value:
      - lambda: 'id(sun_down) = (x == "below_horizon");'
      - script.execute: eval_night

  - platform: homeassistant
    id: ha_alarm_on
    entity_id: switch.${voice_sat}_alarm_on
    internal: true
    on_value:
      - lambda: 'id(alarm_enabled) = (x == "on");'
      - script.execute: update_overlays

  - platform: homeassistant
    id: ha_alarm_time
    entity_id: time.${voice_sat}_alarm_time
    internal: true
    on_value:
      - lambda: 'id(alarm_time_str) = x;'
      - script.execute: update_overlays

  - platform: homeassistant
    id: ha_muted
    entity_id: ${music_player}
    attribute: is_volume_muted
    internal: true
    on_value:
      - lambda: |-
          id(states_on)[vc::MUSIC_IDX] = !(x == "True" || x == "true" || x == "on");
      - script.execute: refresh_ui

number:
  - platform: template
    id: night_brightness
    name: "Night Brightness"
    icon: mdi:brightness-4
    unit_of_measurement: "%"
    min_value: 1
    max_value: 50
    step: 1
    initial_value: 12
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      - if:
          condition:
            lambda: 'return id(night);'
          then:
            - light.turn_on:
                id: display_backlight
                brightness: !lambda 'return x / 100.0f;'

switch:
  - platform: template
    id: force_night
    name: "Force Night Mode"
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: eval_night
    on_turn_off:
      - script.execute: eval_night

binary_sensor:
  # reSpeaker microphone mute (the plunger on top). Shown as an icon on the clock face.
  - platform: homeassistant
    id: mic_muted
    entity_id: switch.${voice_sat}_microphone_mute
    internal: true
    on_state:
      - script.execute: update_overlays

  - platform: template
    id: night_mode
    name: "Night Mode"
    icon: mdi:weather-night
    lambda: 'return id(night);'

  - platform: gpio
    id: knob_button
    internal: true
    pin:
      pcf8574: pcf
      number: 5
      mode:
        input: true
      inverted: true
    filters:
      - delayed_on_off: 30ms
    on_click:
      - min_length: 20ms
        max_length: 700ms
        then:
          - script.execute: knob_press
      # Long press: back to the clock.
      - min_length: 900ms
        max_length: 5s
        then:
          - script.execute: show_clock

touchscreen:
  - platform: cst816
    id: touch_panel
    display: my_display
    reset_pin:
      pcf8574: pcf
      number: 0
      mode:
        output: true
      inverted: false
    update_interval: 50ms
    on_touch:
      then:
        - logger.log:
            format: "Touch at %d, %d"
            args: ["touch.x", "touch.y"]

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      # Timer countdown / alarm label every second; hands once a minute (no second hand).
      - seconds: /1
        then:
          - script.execute: update_overlays
      - seconds: 0
        then:
          - script.execute: update_hands
    on_time_sync:
      then:
        - script.execute: update_hands

script:
  # Night mode: all bedroom lamps off and the sun is down.
  - id: eval_night
    then:
      - if:
          condition:
            lambda: |-
              bool want = id(sun_down);
              for (int i = 0; i < vc::MUSIC_IDX; i++) want = want && !id(states_on)[i];
              want = want || id(force_night).state;
              return want != id(night);
          then:
            - lambda: |-
                id(night) = !id(night);
                if (id(night)) id(day_brightness) = std::max(5, id(levels)[vc::SCREEN_IDX]);
                id(night_mode).publish_state(id(night));
                ESP_LOGI("night", "Night mode %s", id(night) ? "ON" : "OFF");
            - script.execute: apply_theme
            - light.turn_on:
                id: display_backlight
                brightness: !lambda |-
                  return id(night) ? id(night_brightness).state / 100.0f : id(day_brightness) / 100.0f;

  - id: apply_theme
    then:
      - lambda: |-
          bool n = id(night);
          auto c = [](uint32_t hex) { return lv_color_hex(hex); };
          uint32_t bg = n ? 0x000000 : 0xFCEBEC;
          uint32_t num = n ? 0x6A0E18 : 0x6E0A1E;
          uint32_t tick = n ? 0x420A12 : 0x6E0A1E;
          lv_obj_set_style_bg_color(id(clock_page).obj, c(bg), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(control_page).obj, c(bg), LV_PART_MAIN);
          for (auto *l : {id(num12), id(num3), id(num6), id(num9)})
            lv_obj_set_style_text_color(l, c(num), LV_PART_MAIN);
          for (auto *t : {id(tick0), id(tick1), id(tick2), id(tick3), id(tick4), id(tick5), id(tick6), id(tick7)})
            lv_obj_set_style_line_color(t->obj, c(tick), LV_PART_MAIN);
          lv_obj_set_style_line_color(id(hour_hand)->obj, c(n ? 0x7A1A26 : 0xF08090), LV_PART_MAIN);
          lv_obj_set_style_line_color(id(minute_hand)->obj, c(n ? 0xA02234 : 0xD8404F), LV_PART_MAIN);
          for (auto *l : {id(lbl_name), id(lbl_value)})
            lv_obj_set_style_text_color(l, c(n ? 0x8A1E2A : 0x6E0A1E), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_status), c(n ? 0x5A1018 : 0x9A4A5A), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_alarm), c(n ? 0x5A1018 : 0x9A4A5A), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_mute), c(n ? 0x7A1A26 : 0xD8404F), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_timer), c(n ? 0x1E4A66 : 0x3BA7DC), LV_PART_MAIN);
          lv_obj_set_style_arc_color(id(timer_arc), c(n ? 0x1E4A66 : 0x3BA7DC), LV_PART_INDICATOR);

  # Redraw the control page from levels / states_on / dev_idx / ui_mode.
  - id: refresh_ui
    then:
      - lambda: |-
          int i = id(dev_idx);
          int v = id(levels)[i];
          bool adj = id(ui_mode) == 1;
          lv_label_set_text(id(lbl_name), vc::NAMES[i]);
          lv_label_set_text(id(lbl_value), (std::to_string(v) + "%").c_str());
          lv_arc_set_value(id(arc_level), v);
          const char *st;
          if (i == vc::SCREEN_IDX) st = "Brightness";
          else if (i == vc::MUSIC_IDX) st = id(states_on)[i] ? "Volume" : "Muted";
          else st = id(states_on)[i] ? "On" : "Off";
          lv_label_set_text(id(lbl_status), st);
          lv_obj_set_style_arc_opa(id(arc_level), adj ? LV_OPA_COVER : LV_OPA_40, LV_PART_INDICATOR);
          lv_obj_set_style_opa(id(arc_level), adj ? LV_OPA_COVER : LV_OPA_0, LV_PART_KNOB);
          if (adj) {
            lv_obj_add_flag(id(arc_level), LV_OBJ_FLAG_CLICKABLE);
            lv_obj_add_flag(id(btn_prev), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(btn_next), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_remove_flag(id(arc_level), LV_OBJ_FLAG_CLICKABLE);
            lv_obj_remove_flag(id(btn_prev), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(btn_next), LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_t *dots[vc::DEVICE_COUNT] = {id(dot0), id(dot1), id(dot2), id(dot3), id(dot4)};
          for (int k = 0; k < vc::DEVICE_COUNT; k++)
            lv_obj_set_style_bg_color(dots[k], lv_color_hex(k == i ? 0xD8404F : 0xEBC2C7), LV_PART_MAIN);

  - id: idle_timer
    mode: restart
    then:
      - delay: 10s
      - script.execute: show_clock

  - id: show_clock
    then:
      - lambda: 'id(ui_mode) = 0; id(on_clock) = true;'
      - lvgl.page.show: clock_page

  - id: open_control
    then:
      - lambda: 'id(ui_mode) = 0; id(on_clock) = false;'
      - script.execute: refresh_ui
      - lvgl.page.show: control_page
      - script.execute: idle_timer

  # One knob detent (or arrow tap). On the clock it opens the control page.
  - id: knob_step
    parameters:
      dir: int
    then:
      - if:
          condition:
            lambda: 'return id(on_clock);'
          then:
            - script.execute: open_control
          else:
            - script.execute: idle_timer
            - if:
                condition:
                  lambda: 'return id(ui_mode) == 0;'
                then:
                  - lambda: 'id(dev_idx) = (id(dev_idx) + dir + vc::DEVICE_COUNT) % vc::DEVICE_COUNT;'
                else:
                  - lambda: |-
                      int i = id(dev_idx);
                      int v = std::max(i == vc::SCREEN_IDX ? 5 : 0, std::min(100, id(levels)[i] + dir * 5));
                      id(levels)[i] = v;
                      id(last_local_ms)[i] = millis();
                  - script.execute:
                      id: apply_level
                      idx: !lambda 'return id(dev_idx);'
                      level: !lambda 'return id(levels)[id(dev_idx)];'
            - script.execute: refresh_ui

  - id: knob_press
    then:
      - if:
          condition:
            lambda: 'return id(on_clock);'
          then:
            - script.execute: open_control
          else:
            - lambda: 'id(ui_mode) = 1 - id(ui_mode);'
            - script.execute: refresh_ui
            - script.execute: idle_timer

  # Tap in the middle of the control page: select in browse mode, on/off (or mute) in adjust mode.
  - id: center_tap
    then:
      - script.execute: idle_timer
      - if:
          condition:
            lambda: 'return id(ui_mode) == 0;'
          then:
            - lambda: 'id(ui_mode) = 1;'
          else:
            - script.execute:
                id: toggle_device
                idx: !lambda 'return id(dev_idx);'
      - script.execute: refresh_ui

  # Send a level to HA. Restart mode + delay = one call per burst of knob turns.
  - id: apply_level
    mode: restart
    parameters:
      idx: int
      level: int
    then:
      - if:
          condition:
            lambda: 'return idx == vc::SCREEN_IDX;'
          then:
            - light.turn_on:
                id: display_backlight
                brightness: !lambda 'return level / 100.0f;'
          else:
            - delay: 300ms
            - if:
                condition:
                  lambda: 'return idx == vc::MUSIC_IDX;'
                then:
                  - homeassistant.action:
                      action: media_player.volume_set
                      data:
                        entity_id: ${music_player}
                        volume_level: !lambda 'return str_sprintf("%.2f", level / 100.0f);'
                else:
                  - if:
                      condition:
                        lambda: 'return level == 0;'
                      then:
                        - homeassistant.action:
                            action: light.turn_off
                            data:
                              entity_id: !lambda 'return std::string(vc::ENTITIES[idx]);'
                      else:
                        - homeassistant.action:
                            action: light.turn_on
                            data:
                              entity_id: !lambda 'return std::string(vc::ENTITIES[idx]);'
                              brightness_pct: !lambda 'return std::to_string(level);'

  - id: toggle_device
    parameters:
      idx: int
    then:
      - lambda: 'if (idx != vc::SCREEN_IDX) id(states_on)[idx] = !id(states_on)[idx];'
      - if:
          condition:
            lambda: 'return idx < vc::MUSIC_IDX;'
          then:
            - homeassistant.action:
                action: light.toggle
                data:
                  entity_id: !lambda 'return std::string(vc::ENTITIES[idx]);'
      - if:
          condition:
            lambda: 'return idx == vc::MUSIC_IDX;'
          then:
            - homeassistant.action:
                action: media_player.volume_mute
                data:
                  entity_id: ${music_player}
                  is_volume_muted: !lambda 'return std::string(id(states_on)[idx] ? "false" : "true");'

  # Alarm time under the 12 and timer countdown ring + text above the 6.
  - id: update_overlays
    then:
      - lambda: |-
          char buf[24];
          // Alarm
          int h, m;
          bool alarm = id(alarm_enabled) && sscanf(id(alarm_time_str).c_str(), "%d:%d", &h, &m) == 2;
          if (alarm) {
            snprintf(buf, sizeof(buf), "\uF0F3 %d:%02d %s", (h % 12) ? h % 12 : 12, m, h < 12 ? "AM" : "PM");
            // Only on change: every set_text redraws the label.
            if (strcmp(lv_label_get_text(id(lbl_alarm)), buf) != 0)
              lv_label_set_text(id(lbl_alarm), buf);
            lv_obj_remove_flag(id(lbl_alarm), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(lbl_alarm), LV_OBJ_FLAG_HIDDEN);
          }
          // Mic mute
          bool muted = id(mic_muted).has_state() && id(mic_muted).state;
          if (muted != !lv_obj_has_flag(id(lbl_mute), LV_OBJ_FLAG_HIDDEN)) {
            if (muted)
              lv_obj_remove_flag(id(lbl_mute), LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(id(lbl_mute), LV_OBJ_FLAG_HIDDEN);
          }
          // Timer
          if (id(timer_active)) {
            int32_t left_ms = (int32_t) (id(timer_end_ms) - millis());
            int left = left_ms > 0 ? (left_ms + 999) / 1000 : 0;
            if (left >= 3600)
              snprintf(buf, sizeof(buf), "%d:%02d:%02d", left / 3600, (left / 60) % 60, left % 60);
            else
              snprintf(buf, sizeof(buf), "%d:%02d", left / 60, left % 60);
            lv_label_set_text(id(lbl_timer), buf);
            int total = std::max(1, id(timer_total_s));
            lv_arc_set_value(id(timer_arc), std::min(1000, left * 1000 / total));
            lv_obj_remove_flag(id(lbl_timer), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(timer_arc), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(lbl_timer), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(timer_arc), LV_OBJ_FLAG_HIDDEN);
          }

  - id: update_hands
    then:
      - if:
          condition:
            lambda: 'return id(ha_time).now().is_valid();'
          then:
            - lvgl.indicator.update:
                id: hour_hand
                value: !lambda |-
                  auto t = id(ha_time).now();
                  return (t.hour % 12) * 60 + t.minute;
            - lvgl.indicator.update:
                id: minute_hand
                value: !lambda |-
                  auto t = id(ha_time).now();
                  return t.minute * 60;

font:
  - file:
      type: gfonts
      family: Fredoka
      weight: 600
    id: font_numerals
    size: 92
    glyphs: "12369"
  - file:
      type: gfonts
      family: Fredoka
      weight: 600
    id: font_value
    size: 96
    glyphs: "0123456789%"
  - file:
      type: gfonts
      family: Fredoka
      weight: 500
    id: font_name
    size: 36
  - file:
      type: gfonts
      family: Fredoka
      weight: 400
    id: font_small
    size: 22
  # Material Design Icons, only the mic-off glyph.
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons
    size: 48
    glyphs: ["\U000F036D"]

spi:
  clk_pin: 2
  mosi_pin: 1

display:
  - platform: st7701s
    id: my_display
    auto_clear_enabled: false
    update_interval: never
    spi_mode: MODE3
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: 16
    de_pin: 40
    hsync_pin: 15
    vsync_pin: 7
    pclk_pin: 41
    data_pins:
      red: [46, 3, 8, 18, 17]
      green: [14, 13, 12, 11, 10, 9]
      blue: [5, 45, 48, 47, 21]
    hsync_front_porch: 20
    hsync_pulse_width: 10
    hsync_back_porch: 10
    vsync_front_porch: 8
    vsync_pulse_width: 10
    vsync_back_porch: 10
    pclk_frequency: 18MHz
    pclk_inverted: true
    # ST7701S init sequence from Elecrow's CrowPanel 2.1" ESPHome Lesson 05 (21-touch.yaml):
    # https://github.com/Elecrow-RD/CrowPanel-2.1inch-HMI-ESP32-Rotary-Display-480-480-IPS-Round-Touch-Knob-Screen
    init_sequence:
      - [0x01]
      - delay 120ms
