# Palette, from the reference photo
substitutions:
  # reSpeaker voice satellite entity prefix (alarm + timers).
  voice_sat: respeaker_xvf3800_assistant
  # Media player controlled from the control page (volume / mute).
  music_player: media_player.bedroom_speaker   # <- your HA media player
  c_dial: "0xFCEBEC"
  c_numeral: "0x6E0A1E"
  c_hour: "0xF08090"
  c_minute: "0xD8404F"
  c_second: "0x3BA7DC"

lvgl:
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: touch_panel
  buffer_size: 50%
  # The panel sits in the enclosure with its native top edge pointing left.
  # Rotate the UI 90° clockwise so 12 is at the top. Software rotation in LVGL;
  # touch is remapped to match automatically.
  rotation: 90
  pages:
    - id: clock_page
      bg_color: ${c_dial}
      widgets:
        # Hour ticks where there is no numeral.
        - line:
            id: tick0
            align: TOP_LEFT
            points: ["339,69", "352,46"]
            line_width: 8
            line_color: ${c_numeral}
            line_rounded: true
        - line:
            id: tick1
            align: TOP_LEFT
            points: ["411,141", "434,128"]
            line_width: 8
            line_color: ${c_numeral}
            line_rounded: true
        - line:
            id: tick2
            align: TOP_LEFT
            points: ["411,339", "434,352"]
            line_width: 8
            line_color: ${c_numeral}
            line_rounded: true
        - line:
            id: tick3
            align: TOP_LEFT
            points: ["339,411", "352,434"]
            line_width: 8
            line_color: ${c_numeral}
            line_rounded: true
        - line:
            id: tick4
            align: TOP_LEFT
            points: ["141,411", "128,434"]
            line_width: 8
            line_color: ${c_numeral}
            line_rounded: true
        - line:
            id: tick5
            align: TOP_LEFT
            points: ["69,339", "46,352"]
            line_width: 8
            line_color: ${c_numeral}
            line_rounded: true
        - line:
            id: tick6
            align: TOP_LEFT
            points: ["69,141", "46,128"]
            line_width: 8
            line_color: ${c_numeral}
            line_rounded: true
        - line:
            id: tick7
            align: TOP_LEFT
            points: ["141,69", "128,46"]
            line_width: 8
            line_color: ${c_numeral}
            line_rounded: true
        - label:
            id: num12
            align: CENTER
            y: -150
            text_font: font_numerals
            text_color: ${c_numeral}
            text: "12"
        - label:
            id: num3
            align: CENTER
            x: 162
            text_font: font_numerals
            text_color: ${c_numeral}
            text: "3"
        - label:
            id: num6
            align: CENTER
            y: 156
            text_font: font_numerals
            text_color: ${c_numeral}
            text: "6"
        - label:
            id: num9
            align: CENTER
            x: -162
            text_font: font_numerals
            text_color: ${c_numeral}
            text: "9"
        # Timer ring at the very edge, and countdown text above the 6.
        - arc:
            id: timer_arc
            align: CENTER
            width: 476
            height: 476
            rotation: 270
            start_angle: 0
            end_angle: 360
            min_value: 0
            max_value: 1000
            value: 1000
            adjustable: false
            clickable: false
            hidden: true
            arc_opa: TRANSP
            indicator:
              arc_color: ${c_second}
              arc_width: 8
              arc_rounded: true
            knob:
              opa: TRANSP
        - label:
            id: lbl_timer
            align: CENTER
            y: 76
            text_font: font_name
            text_color: ${c_second}
            hidden: true
            text: ""
        - label:
            id: lbl_alarm
            align: CENTER
            y: -82
            text_font: montserrat_24
            text_color: 0x9A4A5A
            hidden: true
            text: ""
        # Mic muted: red mic-off icon inside the 9.
        - label:
            id: lbl_mute
            align: CENTER
            x: -98
            text_font: font_icons
            text_color: ${c_minute}
            hidden: true
            text: "\U000F036D"
        # Hands. Transparent meter laid over the dial; 0 is at 12 o'clock.
        - meter:
            id: clock_meter
            align: CENTER
            width: 480
            height: 480
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            pivot:
              bg_color: ${c_minute}
              width: 26
              height: 26
            scales:
              - range_from: 0
                range_to: 720
                angle_range: 360
                rotation: 270
                indicators:
                  - line:
                      id: hour_hand
                      width: 22
                      color: ${c_hour}
                      length: 115
                      rounded: true
              - range_from: 0
                range_to: 3600
                angle_range: 360
                rotation: 270
                indicators:
                  - line:
                      id: minute_hand
                      width: 18
                      color: ${c_minute}
                      length: 180
                      rounded: true
        # Invisible layer on top: tap anywhere on the clock to open controls.
        - obj:
            align: CENTER
            width: 480
            height: 480
            bg_opa: TRANSP
            border_width: 0
            on_click:
              - script.execute: open_control

    - id: control_page
      bg_color: ${c_dial}
      widgets:
        - arc:
            id: arc_level
            align: CENTER
            width: 440
            height: 440
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            value: 0
            adjustable: true
            arc_color: 0xF3D3D6
            arc_width: 26
            arc_rounded: true
            indicator:
              arc_color: ${c_minute}
              arc_width: 26
              arc_rounded: true
            knob:
              bg_color: ${c_numeral}
              pad_all: 6
            on_change:
              - lambda: |-
                  int i = id(dev_idx);
                  int v = (int) x;
                  if (i == vc::SCREEN_IDX && v < 5) v = 5;
                  id(levels)[i] = v;
                  id(last_local_ms)[i] = millis();
                  lv_label_set_text(id(lbl_value), (std::to_string(v) + "%").c_str());
              - script.execute: idle_timer
            on_release:
              - script.execute:
                  id: apply_level
                  idx: !lambda 'return id(dev_idx);'
                  level: !lambda 'return id(levels)[id(dev_idx)];'
        - label:
            id: lbl_name
            align: CENTER
            y: -100
            text_font: font_name
            text_color: ${c_numeral}
            text: ""
        - label:
            id: lbl_value
            align: CENTER
            y: -10
            text_font: font_value
            text_color: ${c_numeral}
            text: ""
        - label:
            id: lbl_status
            align: CENTER
            y: 68
            text_font: font_small
            text_color: 0x9A4A5A
            text: ""
        # Centre tap target (select / toggle).
        - obj:
            align: CENTER
            width: 220
            height: 200
            y: -20
            bg_opa: TRANSP
            border_width: 0
            on_click:
              - script.execute: center_tap
        - button:
            id: btn_prev
            align: CENTER
            x: -158
            width: 56
            height: 56
            radius: 28
            bg_color: 0xF3D3D6
            shadow_width: 0
            widgets:
              - label:
                  align: CENTER
                  text_font: montserrat_28
                  text_color: ${c_numeral}
                  text: "\uF053"
            on_click:
              - script.execute:
                  id: knob_step
                  dir: -1
        - button:
            id: btn_next
            align: CENTER
            x: 158
            width: 56
            height: 56
            radius: 28
            bg_color: 0xF3D3D6
            shadow_width: 0
            widgets:
              - label:
                  align: CENTER
                  text_font: montserrat_28
                  text_color: ${c_numeral}
                  text: "\uF054"
            on_click:
              - script.execute:
                  id: knob_step
                  dir: 1
        - obj:
            id: dot0
            align: CENTER
            x: -40
            y: 156
            width: 12
            height: 12
            radius: 6
            bg_color: 0xEBC2C7
            border_width: 0
            clickable: false
        - obj:
            id: dot1
            align: CENTER
            x: -20
            y: 156
            width: 12
            height: 12
            radius: 6
            bg_color: 0xEBC2C7
            border_width: 0
            clickable: false
        - obj:
            id: dot2
            align: CENTER
            x: 0
            y: 156
            width: 12
            height: 12
            radius: 6
            bg_color: 0xEBC2C7
            border_width: 0
            clickable: false
        - obj:
            id: dot3
            align: CENTER
            x: 20
            y: 156
            width: 12
            height: 12
            radius: 6
            bg_color: 0xEBC2C7
            border_width: 0
            clickable: false
        - obj:
            id: dot4
            align: CENTER
            x: 40
            y: 156
            width: 12
            height: 12
            radius: 6
            bg_color: 0xEBC2C7
            border_width: 0
            clickable: false
        - button:
            align: CENTER
            y: 196
            width: 64
            height: 44
            radius: 22
            bg_color: 0xF3D3D6
            shadow_width: 0
            widgets:
              - label:
                  align: CENTER
                  text_font: montserrat_28
                  text_color: ${c_numeral}
                  text: "\uF015"
            on_click:
              - script.execute: show_clock
