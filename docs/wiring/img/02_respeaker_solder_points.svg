<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-label="reSpeaker XVF3800 back side: where to solder 5 V and GND">
<style>
  text{font-family:Helvetica,Arial,sans-serif;fill:#222}
  .h{font-size:22px;font-weight:700}
  .b{font-size:15px;font-weight:700}
  .t{font-size:13px}
  .s{font-size:11.5px;fill:#555}
  .wt{fill:#fff}
  .pad{fill:#c9a34a;stroke:#7a5e1e;stroke-width:1}
  .lbl{font-size:12px;font-family:Menlo,Consolas,monospace}
  .warn{fill:#fdecec;stroke:#d62728;stroke-width:1.4}
  .note{fill:#f4f7f5;stroke:#9bb;stroke-width:1.2}
</style>
<rect width="1100" height="700" fill="#fff"/>
<text x="24" y="38" class="h">02 · reSpeaker XVF3800: 5 V and GND solder points</text>
<text x="24" y="60" class="s">Back (component) side, XIAO at 12 o'clock, as in Seeed's pinout photo. Positions are approximate. Board Ø100 mm. Pin labels are from Seeed's pinout.</text>

<!-- board -->
<g>
  <circle cx="260" cy="340" r="200" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
  <!-- mics on diagonals -->
  <g fill="#555" stroke="#888"><rect x="122" y="202" width="12" height="12"/><rect x="386" y="202" width="12" height="12"/><rect x="122" y="466" width="12" height="12"/><rect x="386" y="466" width="12" height="12"/></g>
  <text x="128" y="230" class="s" text-anchor="middle" style="fill:#aaa">mic</text>
  <!-- mounting holes -->
  <g fill="#fff" stroke="#999"><circle cx="175" cy="242" r="6"/><circle cx="345" cy="242" r="6"/><circle cx="260" cy="476" r="6"/></g>
  <!-- XIAO -->
  <rect x="224" y="150" width="72" height="88" rx="4" fill="#2a4a8a" stroke="#9ab"/>
  <rect x="246" y="140" width="28" height="14" rx="5" fill="#bbb" stroke="#666"/>
  <text x="260" y="198" class="t wt" text-anchor="middle" font-weight="700">XIAO</text>
  <text x="260" y="214" class="s" text-anchor="middle" style="fill:#cde">ESP32-S3</text>
  <!-- main USB-C -->
  <rect x="242" y="526" width="36" height="20" rx="7" fill="#bbb" stroke="#666"/>
  <text x="260" y="564" class="s" text-anchor="middle">main USB-C</text>
  <!-- jack -->
  <rect x="176" y="490" width="36" height="30" rx="3" fill="#d98b2b" stroke="#7a4b10"/>
  <text x="166" y="540" class="s" text-anchor="middle">3.5 mm</text>
  <!-- buttons -->
  <rect x="50" y="330" width="16" height="22" rx="3" fill="#ddd" stroke="#666"/>
  <text x="40" y="320" class="s" text-anchor="middle">Reset</text>
  <rect x="454" y="330" width="16" height="22" rx="3" fill="#ddd" stroke="#666"/>
  <text x="482" y="320" class="s" text-anchor="middle">Mute (A)</text>
  <!-- SPK socket -->
  <rect x="402" y="406" width="34" height="20" rx="2" fill="#f3efe4" stroke="#222"/>
  <text x="419" y="446" class="t wt" text-anchor="middle" font-weight="700">SPK</text>
  <!-- header on board -->
  <rect x="146" y="318" width="26" height="108" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/>
  <g class="pad">
    <circle cx="153" cy="324" r="3"/><circle cx="165" cy="324" r="3" style="fill:#d62728"/>
    <circle cx="153" cy="335" r="3" style="fill:#fff"/><circle cx="165" cy="335" r="3"/>
    <circle cx="153" cy="346" r="3"/><circle cx="165" cy="346" r="3"/>
    <circle cx="153" cy="357" r="3"/><circle cx="165" cy="357" r="3"/>
    <circle cx="153" cy="368" r="3"/><circle cx="165" cy="368" r="3"/>
    <circle cx="153" cy="379" r="3"/><circle cx="165" cy="379" r="3"/>
    <circle cx="153" cy="390" r="3"/><circle cx="165" cy="390" r="3"/>
    <circle cx="153" cy="401" r="3"/><circle cx="165" cy="401" r="3"/>
    <circle cx="153" cy="412" r="3"/><circle cx="165" cy="412" r="3"/>
    <circle cx="153" cy="421" r="3"/><rect x="162" y="418" width="6" height="6"/>
  </g>
  <text x="159" y="310" class="s" text-anchor="middle" style="fill:#fff">2×10 header</text>
</g>
<!-- zoom lines -->
<path d="M172 318 L600 300 M172 426 L600 528" stroke="#2a7" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>

<!-- zoomed header -->
<g transform="translate(600,100)">
  <rect x="0" y="0" width="300" height="428" rx="10" fill="#141414" stroke="#2a7" stroke-width="2"/>
  <text x="150" y="26" class="b wt" text-anchor="middle">Header, zoomed (2.54 mm pitch)</text>
  <rect x="114" y="40" width="72" height="370" rx="4" fill="none" stroke="#fff" stroke-width="1.2"/>
  <!-- rows: y = 58 + i*36 -->
  <g class="lbl">
    <text x="100" y="62" text-anchor="end" style="fill:#f5c542">VDDIO</text><text x="200" y="62" style="fill:#fff" font-weight="700">5V</text>
    <text x="100" y="98" text-anchor="end" style="fill:#fff" font-weight="700">GND</text><text x="200" y="98" style="fill:#bbb">5V</text>
    <text x="100" y="134" text-anchor="end" style="fill:#888">X0D39</text><text x="200" y="134" style="fill:#bbb">GND</text>
    <text x="100" y="170" text-anchor="end" style="fill:#888">X0D11</text><text x="200" y="170" style="fill:#888">X1D13</text>
    <text x="100" y="206" text-anchor="end" style="fill:#888">X0D10</text><text x="200" y="206" style="fill:#888">X0D37</text>
    <text x="100" y="242" text-anchor="end" style="fill:#888">X0D00</text><text x="200" y="242" style="fill:#888">X0D38</text>
    <text x="100" y="278" text-anchor="end" style="fill:#bbb">GND</text><text x="200" y="278" style="fill:#bbb">GND</text>
    <text x="100" y="314" text-anchor="end" style="fill:#888">X1D34</text><text x="200" y="314" style="fill:#888">X1D00</text>
    <text x="100" y="350" text-anchor="end" style="fill:#888">X1D22</text><text x="200" y="350" style="fill:#888">X1D01</text>
    <text x="100" y="386" text-anchor="end" style="fill:#888">X1D10</text><text x="200" y="386" style="fill:#888">X1D11</text>
  </g>
  <g class="pad">
    <circle cx="132" cy="58" r="9"/><circle cx="168" cy="58" r="9"/>
    <circle cx="132" cy="94" r="9"/><circle cx="168" cy="94" r="9"/>
    <circle cx="132" cy="130" r="9"/><circle cx="168" cy="130" r="9"/>
    <circle cx="132" cy="166" r="9"/><circle cx="168" cy="166" r="9"/>
    <circle cx="132" cy="202" r="9"/><circle cx="168" cy="202" r="9"/>
    <circle cx="132" cy="238" r="9"/><circle cx="168" cy="238" r="9"/>
    <circle cx="132" cy="274" r="9"/><circle cx="168" cy="274" r="9"/>
    <circle cx="132" cy="310" r="9"/><circle cx="168" cy="310" r="9"/>
    <circle cx="132" cy="346" r="9"/><circle cx="168" cy="346" r="9"/>
    <circle cx="132" cy="382" r="9"/><rect x="159" y="373" width="18" height="18"/>
  </g>
  <g fill="#1a1a1a"><circle cx="132" cy="58" r="3.5"/><circle cx="168" cy="58" r="3.5"/><circle cx="132" cy="94" r="3.5"/><circle cx="168" cy="94" r="3.5"/></g>
  <!-- highlight rings -->
  <circle cx="168" cy="58" r="15" fill="none" stroke="#ff3b30" stroke-width="4"/>
  <circle cx="132" cy="94" r="15" fill="none" stroke="#fff" stroke-width="4"/>
  <circle cx="132" cy="58" r="13" fill="none" stroke="#f5c542" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="150" y="420" class="s" text-anchor="middle" style="fill:#aaa">square pad (X1D11) = far end. Use it to orient.</text>
</g>
<!-- callouts for zoom -->
<path d="M783 58 H960" stroke="#d62728" stroke-width="2" transform="translate(0,100)"/>
<text x="966" y="152" class="b" style="fill:#d62728">+5 V</text>
<text x="966" y="170" class="t">red 22 AWG</text>
<text x="966" y="186" class="s">row 1, right</text>
<path d="M600 194 H560" stroke="#222" stroke-width="2"/>
<text x="554" y="186" class="b" text-anchor="end">GND</text>
<text x="554" y="204" class="t" text-anchor="end">black 22 AWG</text>
<text x="554" y="220" class="s" text-anchor="end">row 2, left</text>
<text x="914" y="232" class="s">The other 5V and</text>
<text x="914" y="246" class="s">GND holes are the</text>
<text x="914" y="260" class="s">same nets: use them</text>
<text x="914" y="274" class="s">if a pad lifts.</text>
<path d="M600 140 H560" stroke="#c9a34a" stroke-width="2" stroke-dasharray="4 3"/>
<text x="554" y="136" class="t" text-anchor="end" style="fill:#a07c10" font-weight="700">VDDIO ≠ 5 V</text>
<text x="554" y="152" class="s" text-anchor="end">right next to +5 V.</text>
<text x="554" y="166" class="s" text-anchor="end">Don't bridge it.</text>

<!-- joint cross-section -->
<g transform="translate(24,578)">
  <text x="0" y="0" class="b">Through-hole joint (side view)</text>
  <path d="M95 14 Q110 30 117 40 L133 40 Q142 30 155 14 Z" fill="#f3f0d0" stroke="#bba"/>
  <rect x="117" y="12" width="16" height="36" fill="#d62728" stroke="#900"/>
  <path d="M125 44 V82" stroke="#b87333" stroke-width="3"/>
  <rect x="0" y="54" width="250" height="12" fill="#1a1a1a"/>
  <rect x="116" y="52" width="18" height="16" fill="#c9a34a"/>
  <path d="M111 66 Q125 84 139 66 Z" fill="#c0c0c0" stroke="#888"/>
  <text x="162" y="26" class="s">hot glue, 10 mm back from the joint</text>
  <text x="258" y="52" class="s">back side (faces the carrier)</text>
  <text x="258" y="76" class="s">LED side: 5 mm gap to the spider, keep it flat</text>
  <text x="0" y="104" class="s">Strip 2–3 mm, tin, push in from the back, solder on the LED side, trim to ≤ 1 mm.</text>
</g>

<!-- steps -->
<rect x="560" y="560" width="516" height="126" rx="8" class="warn"/>
<text x="574" y="584" class="b">Do this first (2 min, bench)</text>
<text x="574" y="606" class="t">1. Power the reSpeaker from its own USB-C. Meter header 5V to GND: ~5.0 V.</text>
<text x="574" y="626" class="t">2. Unplug. Beep header 5V to the XIAO 5V pin: should beep (same rail).</text>
<text x="574" y="646" class="t">3. GND holes sit on a ground plane: 370 °C, a chisel tip, hold 3–4 s.</text>
<text x="574" y="666" class="t">4. If pins are already fitted, solder to the pin stub and heat-shrink it.</text>
</svg>
