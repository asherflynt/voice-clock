<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-label="CrowPanel: power through a plug-in MX1.25 pigtail">
<style>
  text{font-family:Helvetica,Arial,sans-serif;fill:#222}
  .h{font-size:22px;font-weight:700}
  .b{font-size:15px;font-weight:700}
  .t{font-size:13px}
  .s{font-size:11.5px;fill:#555}
  .wt{fill:#fff}
  .hs{fill:#9cc7e8;stroke:#3d6f99;stroke-width:1.2}
  .warn{fill:#fdecec;stroke:#d62728;stroke-width:1.4}
  .card{fill:#fafafa;stroke:#ccc;stroke-width:1.2}
</style>
<rect width="1100" height="700" fill="#fff"/>
<text x="24" y="38" class="h">03 · CrowPanel 2.1": power through a plug-in pigtail</text>
<text x="24" y="60" class="s">No soldering on the CrowPanel itself. Feed 5 V into the same 4-pin MX1.25 port that its supplied USB cable uses, with a spare pigtail, so the panel stays removable.</text>

<!-- rear view -->
<g transform="translate(200,300)">
  <circle r="170" fill="#d7dadd" stroke="#666" stroke-width="2"/>
  <circle r="150" fill="none" stroke="#b9bdc1" stroke-width="1"/>
  <circle r="103" fill="#24502f" stroke="#123" stroke-width="1.5"/>
  <circle r="36" fill="#9aa0a6" stroke="#555"/>
  <g fill="#333"><circle cx="0" cy="-26" r="6"/><circle cx="22" cy="13" r="6"/><circle cx="-22" cy="13" r="6"/></g>
  <text x="0" y="5" class="s" text-anchor="middle" style="fill:#222">hub</text>
  <!-- connectors -->
  <g fill="#f3efe4" stroke="#222" stroke-width="1.2">
    <rect x="-52" y="-92" width="30" height="20" rx="2"/>
    <rect x="22" y="-92" width="30" height="20" rx="2"/>
    <rect x="-92" y="-14" width="20" height="30" rx="2"/>
  </g>
  <rect x="58" y="-30" width="12" height="60" fill="#c89b3c" stroke="#7a5e1e"/>
  <g fill="#ddd" stroke="#555"><rect x="60" y="48" width="14" height="12" rx="2"/><rect x="40" y="66" width="14" height="12" rx="2"/></g>
  <text x="0" y="-112" class="s" text-anchor="middle" style="fill:#222">two 4-pin ports</text>
  <text x="-150" y="0" class="s" text-anchor="middle" style="fill:#222">4-pin</text>
  <text x="112" y="2" class="s" style="fill:#222">FPC</text>
  <text x="80" y="96" class="s" style="fill:#222">buttons</text>
  <text x="0" y="200" class="b" text-anchor="middle">Rear view (layout approximate)</text>
  <text x="0" y="218" class="s" text-anchor="middle">Use the port its MX1.25-to-USB cable plugs into:</text>
  <text x="0" y="232" class="s" text-anchor="middle">the one you flashed it through. Mark it with a dot.</text>
</g>

<!-- A: find pins -->
<rect x="420" y="84" width="656" height="196" rx="10" class="card"/>
<text x="436" y="108" class="b">A · Find 5 V and GND on the supplied cable (meter on DC V)</text>
<rect x="440" y="150" width="70" height="40" rx="5" fill="#eee" stroke="#555"/>
<text x="475" y="175" class="s" text-anchor="middle">charger</text>
<rect x="510" y="158" width="34" height="24" fill="#bbb" stroke="#555"/>
<path d="M544 170 C600 170 600 210 660 210 H720" stroke="#333" stroke-width="5" fill="none"/>
<text x="610" y="244" class="s" text-anchor="middle">supplied MX1.25-to-USB cable</text>
<rect x="720" y="186" width="30" height="50" rx="2" fill="#f3efe4" stroke="#222" stroke-width="1.2"/>
<g fill="#b8862b"><rect x="750" y="192" width="6" height="6"/><rect x="750" y="204" width="6" height="6"/><rect x="750" y="216" width="6" height="6"/><rect x="750" y="228" width="6" height="6"/></g>
<g class="s"><text x="712" y="199" text-anchor="end">1</text><text x="712" y="211" text-anchor="end">2</text><text x="712" y="223" text-anchor="end">3</text><text x="712" y="235" text-anchor="end">4</text></g>
<!-- meter -->
<rect x="860" y="136" width="96" height="120" rx="10" fill="#f2c230" stroke="#8a6d10"/>
<rect x="872" y="148" width="72" height="34" rx="3" fill="#cfe0c8" stroke="#555"/>
<text x="908" y="172" text-anchor="middle" style="font-family:Menlo,monospace;font-size:18px;font-weight:700">5.02</text>
<path d="M860 200 C820 200 800 195 760 195" stroke="#d62728" stroke-width="2.5" fill="none"/>
<path d="M860 232 C820 232 800 231 760 231" stroke="#222" stroke-width="2.5" fill="none"/>
<text x="976" y="160" class="t">Probe pairs of</text>
<text x="976" y="176" class="t">contacts with a</text>
<text x="976" y="192" class="t">needle on each</text>
<text x="976" y="208" class="t">probe. <tspan font-weight="700">+5.0 V</tspan>:</text>
<text x="976" y="224" class="t">red probe = 5 V,</text>
<text x="976" y="240" class="t">black = GND.</text>
<text x="436" y="268" class="s">Write down the two positions before you go on. Pigtail wire colours are not a standard; positions are.</text>

<!-- B: pigtail + splice -->
<rect x="420" y="296" width="656" height="222" rx="10" class="card"/>
<text x="436" y="320" class="b">B · Spare MX1.25 4-pin pigtail → 24 AWG (lead D)</text>
<rect x="440" y="350" width="30" height="62" rx="2" fill="#f3efe4" stroke="#222" stroke-width="1.2"/>
<g stroke-width="2.4" fill="none">
  <path d="M470 360 H700" stroke="#d62728"/>
  <path d="M470 374 H530" stroke="#2a7"/>
  <path d="M470 388 H530" stroke="#2a7"/>
  <path d="M470 402 H760" stroke="#222"/>
</g>
<rect x="528" y="368" width="20" height="12" rx="3" class="hs"/><rect x="528" y="382" width="20" height="12" rx="3" class="hs"/>
<text x="556" y="390" class="s">D+ / D−: cut 5 mm back, shrink each</text>
<!-- splices -->
<rect x="690" y="352" width="44" height="16" rx="4" class="hs"/>
<rect x="750" y="394" width="44" height="16" rx="4" class="hs"/>
<path d="M734 360 H960" stroke="#d62728" stroke-width="4"/>
<path d="M794 402 H960" stroke="#222" stroke-width="4"/>
<text x="712" y="346" class="s" text-anchor="middle">1.5 mm shrink</text>
<text x="772" y="428" class="s" text-anchor="middle">stagger 10 mm</text>
<text x="966" y="364" class="t">24 AWG red</text>
<text x="966" y="406" class="t">24 AWG black</text>
<text x="455" y="430" class="s" text-anchor="middle">plug</text>
<text x="476" y="346" class="s">use the positions from A</text>
<text x="610" y="376" class="s" text-anchor="middle"></text><text x="620" y="420" class="s" text-anchor="middle">28 AWG pigtail, ~10 cm</text>
<!-- inline splice detail -->
<g transform="translate(440,446)">
  <text x="0" y="12" class="t" font-weight="700">Inline splice:</text>
  <path d="M100 8 H150" stroke="#d62728" stroke-width="3"/><path d="M150 8 H176" stroke="#b87333" stroke-width="2"/>
  <path d="M200 8 H226" stroke="#b87333" stroke-width="3"/><path d="M226 8 H286" stroke="#d62728" stroke-width="5"/>
  <text x="188" y="12" class="s" text-anchor="middle">→</text>
  <path d="M310 8 H350" stroke="#d62728" stroke-width="3"/><path d="M350 8 H390" stroke="#b87333" stroke-width="4"/><path d="M390 8 H430" stroke="#d62728" stroke-width="5"/>
  <rect x="344" y="0" width="52" height="16" rx="4" fill="none" stroke="#3d6f99" stroke-dasharray="3 2"/>
  <text x="0" y="38" class="s">Slide on 1.5 mm shrink first. Strip 6 mm on each, lay them side by side, twist, solder, let cool, shrink.</text>
  <text x="0" y="54" class="s">Then one 4.8 mm sleeve over the pair. The splices must sit behind the carrier, not in the notch.</text>
</g>

<!-- C: test -->
<rect x="420" y="534" width="656" height="84" rx="10" class="card"/>
<text x="436" y="558" class="b">C · Test before the case</text>
<text x="436" y="580" class="t">Plug the pigtail into the marked port and feed 5 V from the harness (or a bench supply set to 5.0 V, 1 A limit).</text>
<text x="436" y="600" class="t">The clock face should boot. If nothing happens, unplug at once and re-check step A.</text>

<!-- warning -->
<rect x="24" y="560" width="380" height="120" rx="8" class="warn"/>
<text x="38" y="584" class="b">Why not solder to the board?</text>
<text x="38" y="604" class="s">Elecrow's schematic routes 5 V into the main board only</text>
<text x="38" y="619" class="s">through its 12-pin FPC (pins 1–2 = 5 V, 11–12 = GND)</text>
<text x="38" y="634" class="s">and a tiny test pad. A plug-in lead avoids heat on the</text>
<text x="38" y="649" class="s">display and keeps the panel removable.</text>
<text x="38" y="668" class="s" style="fill:#d62728">Its UART pins are level-shifted to 5 V logic (v2 note).</text>
</svg>
