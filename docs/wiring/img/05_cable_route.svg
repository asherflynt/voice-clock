<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 710" width="1100" height="710" role="img" aria-label="Side section showing the cable route inside the Voice Clock">
<style>
  text{font-family:Helvetica,Arial,sans-serif;fill:#222}
  .h{font-size:22px;font-weight:700}
  .b{font-size:15px;font-weight:700}
  .t{font-size:13px}
  .s{font-size:11.5px;fill:#555}
  .num{font-size:12px;font-weight:700;fill:#fff}
  .part{font-size:11px;fill:#444}
</style>
<rect width="1100" height="710" fill="#fff"/>
<text x="24" y="38" class="h">05 · Where the wires run (side section)</text>
<text x="24" y="60" class="s">Front (knob) on the left, back plate on the right. Parts to scale (4.5 px/mm) from the CAD, face tilt left out. Wires drawn schematically.</text>

<g transform="translate(0,34)">
<!-- shell -->
<path d="M202.5 132 A270 270 0 0 1 565.65 128.4 L565.65 531.6 A270 270 0 0 1 202.5 528 Z" fill="#fbf6f4" stroke="#c9b8b3" stroke-width="10"/>
<rect x="565.65" y="128.4" width="11.3" height="403.2" fill="#d9ccc8" stroke="#a99"/>
<text x="571" y="122" class="part" text-anchor="middle">back plate</text>
<!-- light ring (ring base + ring shell) -->
<rect x="202.5" y="132" width="150" height="17" fill="#cfe8f5" stroke="#7ab" opacity=".9"/>
<path d="M202.5 511 H335 V519 H352.5 V528 H202.5 Z" fill="#cfe8f5" stroke="#7ab" opacity=".9"/>
<text x="276" y="126" class="part" text-anchor="middle">light ring</text>
<!-- CrowPanel -->
<rect x="171" y="152" width="63" height="356" rx="6" fill="#c4c8cc" stroke="#666"/>
<rect x="234" y="155" width="43" height="350" fill="#aab0b6" stroke="#666"/>
<rect x="277" y="222" width="15" height="216" fill="#24502f" stroke="#123"/>
<rect x="277" y="292" width="24" height="76" fill="#9aa0a6" stroke="#555"/>
<rect x="292" y="240" width="29" height="18" fill="#f3efe4" stroke="#222"/>
<rect x="292" y="398" width="29" height="18" fill="#f3efe4" stroke="#222"/>
<text x="224" y="96" class="part" text-anchor="middle">CrowPanel knob + display</text>
<path d="M224 100 V150" stroke="#999"/>
<!-- spider + spacers -->
<rect x="324" y="200" width="13.5" height="260" fill="#e7d9a8" stroke="#a8964d"/>
<rect x="337.5" y="180" width="22.5" height="14" fill="#e7d9a8" stroke="#a8964d"/>
<rect x="337.5" y="466" width="22.5" height="14" fill="#e7d9a8" stroke="#a8964d"/>
<text x="331" y="194" class="part" text-anchor="middle">spider</text>
<!-- reSpeaker -->
<rect x="360" y="105" width="5.4" height="450" fill="#1a1a1a"/>
<rect x="365.4" y="118" width="26" height="40" fill="#2a4a8a"/>
<rect x="365.4" y="300" width="14" height="30" fill="#c9a34a" stroke="#7a5e1e"/>
<rect x="365.4" y="352" width="12" height="16" fill="#f3efe4" stroke="#222"/>
<text x="362" y="98" class="part" text-anchor="middle">reSpeaker</text>
<text x="367" y="294" class="part">header</text>
<text x="381" y="380" class="part">SPK</text>
<!-- carrier -->
<path d="M414 92 H425 V300 H414 Z M414 360 H425 V556 H414 Z" fill="#e2d4cf" stroke="#a99"/>
<text x="420" y="86" class="part" text-anchor="middle">carrier</text>
<!-- speaker -->
<rect x="497" y="260" width="68.6" height="140" rx="4" fill="#555" stroke="#222"/>
<rect x="552" y="272" width="13" height="116" fill="#888"/>
<text x="531" y="252" class="part" text-anchor="middle">speaker</text>
<!-- USB-C inlet -->
<rect x="506" y="445" width="59.6" height="12" fill="#1d2a22"/>
<rect x="565.65" y="444" width="11" height="14" fill="#bbb" stroke="#666"/>
<text x="536" y="476" class="part" text-anchor="middle">USB-C inlet</text>

<!-- D: pigtail from the CrowPanel port, across the gap inside the light ring, to the header's spare pins (LED side) -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M321 405 H336 Q346 405 346 395 V318 H360" stroke="#d62728" stroke-width="3"/>
  <path d="M321 410 H340 Q351 410 351 400 V326 H360" stroke="#222" stroke-width="3"/>
  <!-- C: B-C splice behind the carrier, through the centre hole, to the header (back side) -->
  <path d="M452 494 V340 H379" stroke="#d62728" stroke-width="3"/>
  <path d="M456 494 V346 H379" stroke="#222" stroke-width="3"/>
  <!-- B + A: splice -> disconnect -> inlet -->
  <path d="M452 500 H480 M486 500 Q500 500 506 452" stroke="#d62728" stroke-width="3"/>
  <path d="M456 506 H480 M486 506 Q506 506 510 457" stroke="#222" stroke-width="3"/>
  <!-- speaker lead -->
  <path d="M497 300 H470 Q462 300 462 310 V360 H377" stroke="#888" stroke-width="2.5" stroke-dasharray="6 3"/>
</g>
<rect x="445" y="494" width="16" height="16" rx="3" fill="#9cc7e8" stroke="#3d6f99"/>
<rect x="478" y="494" width="10" height="18" fill="#f3efe4" stroke="#222"/>

<!-- callout markers -->
<g>
  <circle cx="306" cy="430" r="10" fill="#1b6ca8"/><text x="306" y="434" class="num" text-anchor="middle">1</text>
  <circle cx="330" cy="352" r="10" fill="#1b6ca8"/><text x="330" y="356" class="num" text-anchor="middle">2</text>
  <circle cx="440" cy="330" r="10" fill="#1b6ca8"/><text x="440" y="334" class="num" text-anchor="middle">3</text>
  <circle cx="452" cy="530" r="10" fill="#1b6ca8"/><text x="452" y="534" class="num" text-anchor="middle">4</text>
  <circle cx="494" cy="530" r="10" fill="#1b6ca8"/><text x="494" y="534" class="num" text-anchor="middle">5</text>
  <circle cx="520" cy="430" r="10" fill="#1b6ca8"/><text x="520" y="434" class="num" text-anchor="middle">6</text>
  <circle cx="480" cy="286" r="10" fill="#1b6ca8"/><text x="480" y="290" class="num" text-anchor="middle">7</text>
  <circle cx="349" cy="478" r="10" fill="#d62728"/><text x="349" y="482" class="num" text-anchor="middle">!</text>
</g>

</g>
<!-- legend -->
<g transform="translate(624,110)">
  <rect x="0" y="0" width="452" height="566" rx="10" fill="#fafafa" stroke="#ccc"/>
  <g class="t">
    <circle cx="24" cy="30" r="10" fill="#1b6ca8"/><text x="24" y="34" class="num" text-anchor="middle">1</text>
    <text x="44" y="34">Pigtail (lead D) plug in the CrowPanel power port.</text>
    <circle cx="24" cy="76" r="10" fill="#1b6ca8"/><text x="24" y="80" class="num" text-anchor="middle">2</text>
    <text x="44" y="72">Between the spider arms and across the 5 mm gap to the</text>
    <text x="44" y="88">header's spare 5V / GND holes, soldered from the LED side.</text>
    <text x="44" y="104">All of it inside the light ring: no notch, nothing at the edge.</text>
    <circle cx="24" cy="142" r="10" fill="#1b6ca8"/><text x="24" y="146" class="num" text-anchor="middle">3</text>
    <text x="44" y="138">Lead C through the carrier's centre hole to the</text>
    <text x="44" y="154">header's 5V / GND from the back side.</text>
    <circle cx="24" cy="192" r="10" fill="#1b6ca8"/><text x="24" y="196" class="num" text-anchor="middle">4</text>
    <text x="44" y="188">B–C inline splices (+ optional capacitor). Hot-glue or</text>
    <text x="44" y="204">zip-tie them to the carrier back so no tug reaches a joint.</text>
    <circle cx="24" cy="242" r="10" fill="#1b6ca8"/><text x="24" y="246" class="num" text-anchor="middle">5</text>
    <text x="44" y="238">Disconnect. Unplug it to lift the back plate off.</text>
    <text x="44" y="254">Clear of the speaker and the inlet cage.</text>
    <circle cx="24" cy="292" r="10" fill="#1b6ca8"/><text x="24" y="296" class="num" text-anchor="middle">6</text>
    <text x="44" y="288">Lead A to the USB-C inlet. Stays with the back plate.</text>
    <text x="44" y="304">10 cm gives room to set the plate beside the clock.</text>
    <circle cx="24" cy="342" r="10" fill="#1b6ca8"/><text x="24" y="346" class="num" text-anchor="middle">7</text>
    <text x="44" y="338">Speaker lead (plug-in, no soldering) through the</text>
    <text x="44" y="354">centre hole to the SPK socket. Zip-tie it to its anchor.</text>
    <circle cx="24" cy="396" r="10" fill="#d62728"/><text x="24" y="400" class="num" text-anchor="middle">!</text>
    <text x="44" y="392" font-weight="700">No splices, heat shrink or loops in the 5 mm gap</text>
    <text x="44" y="408">between the spider and the reSpeaker. Only the bare</text>
    <text x="44" y="424">pigtail passes there; trim its joints flat on the LED side.</text>
    <text x="20" y="470" class="s">The carrier's centre hole is the only wire opening in the stack.</text>
    <text x="20" y="486" class="s">Nothing runs round the board edge, so the finished stack drops</text>
    <text x="20" y="502" class="s">into the rear shell at its keyed angle with every lead plugged in,</text>
    <text x="20" y="518" class="s">and the front shell twist-locks on with no wires attached to it.</text>
    <text x="20" y="546" class="s">Leave about 2 cm of slack on lead C behind the carrier.</text>
  </g>
</g>
</svg>
